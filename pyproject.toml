[project]
name = "fermata-backend"
version = "0.1.0"
description = "Production-ready music streaming backend powered by FastAPI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.138.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.14.0",
    "passlib[bcrypt]>=1.7.4",
    "argon2-cffi>=21.3.0",
    "pyjwt>=2.8.0",
    "pwdlib[argon2]>=0.3.0",
    "pytest>=9.1.1",
    "boto3>=1.28.0",
    "pgvector>=0.5.0",
    "requests>=2.31.0",
    "ddgs>=9.14.4",
    "numpy>=2.0.0",
    "gradio",
    "websockets>=16.0",
    "langchain-core>=0.2.0",
    "langchain-mistralai>=0.1.0",
    "yt-dlp>=2026.7.1",
    "modal>=1.5.3",
    "langgraph>=0.1.0",
    "redis>=4.5.0",
    "pillow>=10.0.0",
    "duckduckgo-search>=8.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
norecursedirs = ["agentic_ai"]
